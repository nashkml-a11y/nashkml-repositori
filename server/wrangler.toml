name = "buscador-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Orígenes permitidos para CORS. En local incluye el puerto de "vite dev";
# en producción añade la URL de tu proyecto de Cloudflare Pages.
[vars]
CORS_ORIGIN = "http://localhost:5173"

# Creada con `npm run db:create`. Sustituye database_id por el que te
# devuelva ese comando y aplica las migraciones con `npm run db:migrate:*`.
[[d1_databases]]
binding = "DB"
database_name = "buscador-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# La clave de Anthropic NO va aquí (este fichero se versiona en git).
# Se define como secret: `wrangler secret put ANTHROPIC_API_KEY`
# y, para desarrollo local, en `.dev.vars` (ver .dev.vars.example).
