<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gothic Action Theme</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #060408;
  color: #b8a0e8;
  font-family: 'Courier New', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
#player {
  border: 2px solid #3a1a6a;
  background: #0e061e;
  padding: 20px;
  width: 300px;
  max-width: calc(100vw - 32px);
  text-align: center;
  box-shadow: 0 0 32px #1a0a3a88;
}
h1 {
  font-size: 12px;
  letter-spacing: 4px;
  color: #8050d0;
  margin-bottom: 2px;
  text-transform: uppercase;
}
.meta {
  font-size: 9px;
  color: #483060;
  letter-spacing: 2px;
  margin-bottom: 16px;
}
#scope {
  display: block;
  width: 100%;
  height: 56px;
  background: #06030d;
  border: 1px solid #201040;
  margin-bottom: 16px;
}
#btn {
  background: #140830;
  color: #b8a0e8;
  border: 2px solid #5030a0;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  letter-spacing: 4px;
  padding: 11px 0;
  cursor: pointer;
  width: 100%;
}
#btn:active { background: #2a1050; }
.ch-row {
  display: flex;
  justify-content: space-around;
  margin-top: 12px;
  font-size: 8px;
  color: #302048;
  letter-spacing: 1px;
}
.active { color: #7050b8 !important; }
</style>
</head>
<body>
<div id="player">
  <h1>GOTHIC ACTION THEME</h1>
  <div class="meta">A MINOR · 128 BPM · 4/4 · LOOP</div>
  <canvas id="scope" width="260" height="56"></canvas>
  <button id="btn">&#9654; PLAY</button>
  <div class="ch-row">
    <span id="c1">CH1 PLS25</span>
    <span id="c2">CH2 PLS50</span>
    <span id="c3">CH3 WAVE</span>
    <span id="c4">CH4 NOISE</span>
  </div>
</div>

<script>
// ============================================================
//  GOTHIC ACTION THEME ENGINE  —  Web Audio API
//  4-channel 16-bit handheld synthesis, no external deps
//
//  CH1: 25% pulse wave  (lead melody)
//  CH2: 50% square wave (contrapuntal harmony)
//  CH3: custom wavetable (melodic bass)
//  CH4: filtered noise   (kick / snare / hi-hat)
//
//  Key: A natural minor + harmonic minor cadences
//  Tempo: 128 BPM  |  Metre: 4/4  |  Loop: 8 bars
//
//  Musical arc:
//   Bars 1–4: noble quarter/eighth theme, rests between phrases
//   Bars 5–6: eighth-note reprise, energy builds
//   Bar  7:   first sixteenth burst, harmonic minor V climbs
//   Bar  8:   full sixteenth run → loop (most memorable moment)
//
//  ── EMBED IN YOUR GAME ──────────────────────────────────
//  Copy everything between the <script> tags.
//  Then:
//    const music = new GothicThemeEngine();
//    someButton.onclick = () => music.toggle();
//    music.setVolume(0.8);   // 0–1
// ============================================================

class GothicThemeEngine {
  constructor() {
    this.ctx      = null;
    this.master   = null;
    this.analyser = null;
    this.playing  = false;
    this.loopTimer = null;
    this.S  = 60 / 128 / 4;  // sixteenth-note duration at 128 BPM ≈ 0.1172 s
    this.w25  = null;         // 25% pulse wavetable
    this.wBas = null;         // bass wavetable
    this.nBuf = {};           // pre-built noise buffers
  }

  // ── Public API ──────────────────────────────────────────

  /** Must be called inside a user gesture before first play. */
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();

    this.master = this.ctx.createGain();
    this.master.gain.value = 0.72;

    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 512;
    this.analyser.smoothingTimeConstant = 0.55;

    this.master.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);

    this._buildTables();
    this._buildNoise();
  }

  play() {
    if (this.playing) return;
    this.playing = true;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this._scheduleLoop(this.ctx.currentTime + 0.05);
  }

  stop() {
    this.playing = false;
    clearTimeout(this.loopTimer);
    if (this.master) {
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setValueAtTime(this.master.gain.value, t);
      this.master.gain.linearRampToValueAtTime(0, t + 0.06);
      setTimeout(() => { if (!this.playing && this.master) this.master.gain.value = 0.72; }, 120);
    }
  }

  /** Toggle play/stop. Returns true when now playing. */
  toggle() {
    this.init();
    this.playing ? this.stop() : this.play();
    return this.playing;
  }

  /** vol: 0–1 */
  setVolume(vol) {
    if (this.master) this.master.gain.value = Math.max(0, Math.min(1, vol)) * 0.72;
  }

  // ── Scheduler ───────────────────────────────────────────

  _scheduleLoop(t) {
    this._scheduleSeq(t);
    const loopDur = 128 * this.S;
    const delay = (t + loopDur - this.ctx.currentTime - 0.25) * 1000;
    this.loopTimer = setTimeout(() => {
      if (this.playing) this._scheduleLoop(t + loopDur);
    }, Math.max(delay, 50));
  }

  _scheduleSeq(t) {
    const S = this.S;
    let c = t;

    // CH1 — lead melody
    // Dynamic gate: long notes breathe more (imponente); short notes tight (urgente)
    for (const [n, d] of LEAD) {
      if (n !== 'R') {
        const gate = d >= 4 ? 0.80 : d >= 2 ? 0.87 : 0.93;
        this._p25(F[n], c, d * S * gate, 0.38);
      }
      c += d * S;
    }
    c = t;

    // CH2 — contrapuntal harmony
    // More legato than lead: fills the space during lead's rests
    for (const [n, d] of HARMONY) {
      const gate = d >= 4 ? 0.88 : d >= 2 ? 0.93 : 0.96;
      this._p50(F[n], c, d * S * gate, 0.18);
      c += d * S;
    }
    c = t;

    // CH3 — bass (always legato)
    for (const [n, d] of BASS) {
      this._bas(F[n], c, d * S * 0.93, 0.44);
      c += d * S;
    }

    // CH4 — percussion
    // Bars 1–4: quarter-note hi-hats, straightforward kick on 1 & 3
    // Bars 5–8: same hi-hats but adds syncopated kick on beat 3+ for drive
    const barLen = 16 * S;
    for (let b = 0; b < 8; b++) {
      const bt  = t + b * barLen;
      const pat = b < 4 ? PERC_A : PERC_B;
      for (const [sl, tp] of pat) {
        const pt = bt + sl * S;
        if      (tp === 'K') this._kick (pt, 0.58);
        else if (tp === 'S') this._snare(pt, 0.30);
        else                 this._hhat (pt, 0.11);
      }
    }
  }

  // ── Voice generators ────────────────────────────────────

  _p25(hz, t, d, v) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.setPeriodicWave(this.w25);
    o.frequency.value = hz;
    this._env(g.gain, t, d, v);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + d + 0.01);
  }

  _p50(hz, t, d, v) {
    const o = this.ctx.createOscillator();
    const f = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();
    o.type = 'square';
    o.frequency.value = hz;
    f.type = 'lowpass'; f.frequency.value = 5500; f.Q.value = 0.4;
    this._env(g.gain, t, d, v);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + d + 0.01);
  }

  _bas(hz, t, d, v) {
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.setPeriodicWave(this.wBas);
    o.frequency.value = hz;
    // Plucked-style: fast attack, mid-point decay, taper off
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + 0.006);
    g.gain.setValueAtTime(v * 0.76, t + d * 0.35);
    g.gain.linearRampToValueAtTime(0, t + d);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + d + 0.01);
  }

  _kick(t, v) {
    // Sine sweep 170→42 Hz over 70 ms
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(170, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.07);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.14);
    this._noise(this.nBuf.kick, t, 0.018, 'lowpass', 350, v * 0.28);
  }

  _snare(t, v) {
    this._noise(this.nBuf.snare, t, 0.075, 'bandpass', 2000, v, 0.85);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'square'; o.frequency.value = 210;
    g.gain.setValueAtTime(v * 0.20, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.020);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.022);
  }

  _hhat(t, v) {
    this._noise(this.nBuf.hihat, t, 0.030, 'highpass', 7500, v);
  }

  // ── Helpers ─────────────────────────────────────────────

  _noise(buf, t, dur, fType, fHz, vol, Q) {
    const s = this.ctx.createBufferSource();
    const f = this.ctx.createBiquadFilter();
    const g = this.ctx.createGain();
    s.buffer = buf;
    f.type = fType; f.frequency.value = fHz;
    if (Q !== undefined) f.Q.value = Q;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.005);
  }

  _env(p, t, d, v) {
    p.setValueAtTime(0, t);
    p.linearRampToValueAtTime(v, t + 0.003);
    p.setValueAtTime(v, t + Math.max(d - 0.01, 0.003));
    p.linearRampToValueAtTime(0, t + d);
  }

  _buildTables() {
    const N = 64;

    // 25% pulse: a_n = (2 / nπ) · sin(n·π·0.25)
    const r1 = new Float32Array(N), i1 = new Float32Array(N);
    for (let n = 1; n < N; n++) i1[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * 0.25);
    this.w25 = this.ctx.createPeriodicWave(r1, i1, {disableNormalization: false});

    // Bass: sawtooth-leaning, attenuated even harmonics
    const r2 = new Float32Array(N), i2 = new Float32Array(N);
    for (let n = 1; n < N; n++) i2[n] = n % 2 === 1 ? 1 / n : 0.35 / n;
    this.wBas = this.ctx.createPeriodicWave(r2, i2, {disableNormalization: false});
  }

  _buildNoise() {
    const sr = this.ctx.sampleRate;
    const mk = len => {
      const b = this.ctx.createBuffer(1, len, sr);
      const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return b;
    };
    this.nBuf.kick  = mk(Math.ceil(sr * 0.020));
    this.nBuf.snare = mk(Math.ceil(sr * 0.080));
    this.nBuf.hihat = mk(Math.ceil(sr * 0.035));
  }
}

// ============================================================
//  FREQUENCY TABLE  —  equal temperament, A4 = 440 Hz
// ============================================================
const F = (() => {
  const A4 = 440;
  const ns = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const m  = {};
  for (let oct = 1; oct <= 6; oct++)
    ns.forEach((nm, i) => { m[nm + oct] = A4 * Math.pow(2, ((oct - 4) * 12 + (i - 9)) / 12); });
  return m;
})();

// ============================================================
//  SCORE  —  A natural / harmonic minor · 128 BPM · 8 bars
//
//  Each entry: [note_name, duration_in_sixteenth_notes]
//    'R' = rest (cursor advances, no sound)
//  Durations: 4 = quarter, 2 = eighth, 1 = sixteenth
//
//  Structural arc:
//    Bars 1–2: Statement + response. Quarter-note melody,
//              explicit rest on beat 4 → pickup note.
//    Bars 3–4: Development. Longer lines, phrase suspends.
//    Bars 5–6: Reprise in eighth notes. Energy accelerates.
//    Bar  7:   V chord, first sixteenth burst (beat 2 run).
//    Bar  8:   Climax. Full 12-note sixteenth scale run.
//              Ends on G#4 → loops to E5 (bar 1): a minor
//              sixth leap that makes the loop feel inevitable.
// ============================================================

// ── CH1: Lead Melody  (25% pulse) ───────────────────────────
const LEAD = [
  // Bar 1 — Am (i) — opening statement, quarter weight, rest on beat 4
  ['E5',4],  ['A5',2],['G5',2],  ['E5',4],  ['R',2],['C5',2],

  // Bar 2 — F (VI) — response, descends through chord, rest on beat 4
  ['F5',4],  ['E5',2],['D5',2],  ['C5',4],  ['R',2],['A4',2],

  // Bar 3 — C (III) — ascending phrase, no rest, builds toward suspension
  ['G5',4],  ['A5',2],['G5',2],  ['E5',2],['G5',2],  ['D5',4],

  // Bar 4 — G (VII) — suspended cadence: phrase ends on D5 (5th of G, unresolved)
  ['B4',4],  ['D5',4],  ['G5',2],['F5',2],  ['D5',4],

  // Bar 5 — Am (i) — reprise in eighth notes, energy begins rising
  ['A4',2],['C5',2],  ['E5',4],  ['A5',2],['G5',2],  ['E5',2],['D5',2],

  // Bar 6 — Dm (iv) — all eighths, relentless forward motion
  ['D5',2],['F5',2],  ['A5',2],['G5',2],  ['F5',2],['E5',2],  ['D5',2],['C5',2],

  // Bar 7 — E/G# (V, harmonic minor) — sixteenth burst on beat 2, then resolve down
  ['E4',2],['G#4',2],  ['B4',1],['C5',1],['D5',1],['E5',1],  ['D5',2],['B4',2],  ['G#4',4],

  // Bar 8 — Am climax — full sixteenth run ascending then descending Am harmonic minor
  // Last note G#4 (raised 7th) → bar 1 opens on E5: a ♭6 leap, maximally tense loop point
  ['A4',1],['B4',1],['C5',1],['D5',1],  ['E5',1],['F5',1],['E5',1],['D5',1],
  ['C5',1],['B4',1],['A4',1],['G#4',1],  ['E5',4],
];

// ── CH2: Counterpoint Harmony  (50% square) ─────────────────
// Bars 1–4: quarter notes, contrary motion to lead.
//           Sustains through lead's rests (fills the silence).
// Bars 5–6: moves in eighths, mirroring lead's acceleration.
// Bar  7:   mirrors lead's sixteenth burst an octave below.
// Bar  8:   holds Am chord (stable bed under climax run).
//           Final beat uses G#3 to double the harmonic tension.
const HARMONY = [
  // Bar 1 — Am
  ['A3',4],  ['C4',4],  ['E4',4],  ['C4',4],

  // Bar 2 — F
  ['F3',4],  ['A3',4],  ['C4',4],  ['A3',4],

  // Bar 3 — C
  ['G4',4],  ['E4',4],  ['G4',4],  ['A4',4],

  // Bar 4 — G
  ['B3',4],  ['G4',4],  ['B4',4],  ['G4',4],

  // Bar 5 — Am
  ['A3',2],['C4',2],  ['E4',4],  ['A4',2],['G4',2],  ['E4',2],['C4',2],

  // Bar 6 — Dm
  ['D4',2],['F4',2],  ['A4',2],['F4',2],  ['D4',2],['F4',2],  ['E4',2],['D4',2],

  // Bar 7 — E/G# (mirrors lead's sixteenth burst one octave lower)
  ['E3',2],['G#3',2],  ['B3',1],['C4',1],['D4',1],['E4',1],  ['D4',2],['B3',2],  ['G#3',4],

  // Bar 8 — Am (stable quarters; G#3 on beat 4 doubles leading-tone tension)
  ['A3',4],  ['C4',4],  ['E4',4],  ['G#3',4],
];

// ── CH3: Melodic Bass  (custom wavetable) ───────────────────
// Bars 1–4: pure quarter notes, stately root-motion arpeggios.
// Bars 5–6: eighth-note arpeggios, mirrors lead energy rise.
// Bars 7–8: eighth notes, drives the climax.
const BASS = [
  // Bar 1 — Am  (root → 5th → 3rd → root: stately)
  ['A2',4],  ['E3',4],  ['C3',4],  ['A2',4],

  // Bar 2 — F
  ['F2',4],  ['C3',4],  ['A2',4],  ['F2',4],

  // Bar 3 — C
  ['C3',4],  ['G3',4],  ['E3',4],  ['G2',4],

  // Bar 4 — G
  ['G2',4],  ['D3',4],  ['B2',4],  ['D3',4],

  // Bar 5 — Am  (eighth notes enter)
  ['A2',2],['C3',2],  ['E3',4],  ['A3',2],['G3',2],  ['E3',4],

  // Bar 6 — Dm
  ['D3',2],['F3',2],  ['A3',4],  ['F3',2],['D3',2],  ['A2',4],

  // Bar 7 — E/G#
  ['E2',2],['G#2',2],  ['B2',4],  ['E3',2],['B2',2],  ['G#2',4],

  // Bar 8 — Am climax (eighth-note Am arpeggios drive the sixteenth run above)
  ['A2',2],['E3',2],  ['A3',2],['E3',2],  ['A2',2],['C3',2],  ['E3',2],['A2',2],
];

// ── CH4: Percussion  (filtered noise + sine sweep) ──────────
// K = kick  |  S = snare  |  H = hi-hat (quarter-note only)
// Positions are 0-indexed sixteenth offsets within one bar.

// Bars 1–4: measured — kick on beats 1 & 3, snare on 2 & 4
const PERC_A = [
  [0,'K'],[0,'H'],   [4,'S'],[4,'H'],   [8,'K'],[8,'H'],   [12,'S'],[12,'H'],
];

// Bars 5–8: driving — adds syncopated kick on slot 10 (the "and" of beat 3)
const PERC_B = [
  [0,'K'],[0,'H'],   [4,'S'],[4,'H'],   [8,'K'],[8,'H'],   [10,'K'],   [12,'S'],[12,'H'],
];

// ============================================================
//  PLAYER UI  —  oscilloscope scope + play/stop button
// ============================================================
const engine = new GothicThemeEngine();
const btn    = document.getElementById('btn');
const canvas = document.getElementById('scope');
const cx     = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

btn.addEventListener('click', () => {
  const on = engine.toggle();
  btn.textContent = on ? '&#9632; STOP' : '&#9654; PLAY';
  ['c1','c2','c3','c4'].forEach(id =>
    document.getElementById(id).classList.toggle('active', on));
  if (on) rafScope();
});

function rafScope() {
  if (!engine.playing || !engine.analyser) {
    cx.fillStyle = '#06030d';
    cx.fillRect(0, 0, W, H);
    return;
  }
  requestAnimationFrame(rafScope);

  const data = new Uint8Array(engine.analyser.frequencyBinCount);
  engine.analyser.getByteTimeDomainData(data);

  cx.fillStyle = 'rgba(6,3,13,0.65)';
  cx.fillRect(0, 0, W, H);

  cx.strokeStyle = '#5030a0';
  cx.lineWidth = 1.5;
  cx.beginPath();
  const step = W / data.length;
  for (let i = 0; i < data.length; i++) {
    const y = (data[i] / 255) * H;
    i === 0 ? cx.moveTo(0, y) : cx.lineTo(i * step, y);
  }
  cx.stroke();

  // CRT scanline overlay
  cx.fillStyle = 'rgba(0,0,0,0.10)';
  for (let y = 0; y < H; y += 2) cx.fillRect(0, y, W, 1);
}
</script>
</body>
</html>
