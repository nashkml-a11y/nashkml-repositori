<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0A12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fuga — Detecta y cancela lo que no usas</title>
<meta name="description" content="Fuga detecta suscripciones olvidadas en segundos y te ayuda a cancelarlas. Deja de pagar por lo que no usas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFC'/%3E%3Cstop offset='1' stop-color='%2300E6A8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 2C12 2 5 11 5 15.5A7 7 0 0 0 19 15.5C19 11 12 2 12 2Z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0A0A12; --bg-2:#0E0E18;
  --surface:#15151F; --surface-2:#1D1D2B; --surface-3:#25253566;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --text:#F5F5FA; --text-dim:#9A9AB0; --text-faint:#6B6B80;
  --primary:#8B6CFF; --primary-2:#5B3FFF; --accent:#00E6A8; --accent-2:#00B686;
  --danger:#FF4D6D; --danger-2:#C81D3E; --warning:#FFB020;
  --grad-brand:linear-gradient(135deg,#8B6CFF 0%,#00E6A8 100%);
  --grad-danger:linear-gradient(135deg,#FF6B8B 0%,#FF4D6D 100%);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.55);
  --radius:22px;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#F3F3F8; --bg-2:#EAEAF3;
  --surface:#FFFFFF; --surface-2:#F3F3FA; --surface-3:#00000010;
  --border:rgba(10,10,30,.08); --border-strong:rgba(10,10,30,.14);
  --text:#12121E; --text-dim:#5C5C74; --text-faint:#8A8AA0;
  --shadow-lg:0 24px 60px -18px rgba(20,20,50,.18);
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; align-items:center; justify-content:center;
  min-height:100dvh; position:relative; overflow:hidden;
  transition:background .3s ease,color .3s ease;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;}
p{line-height:1.5;color:var(--text-dim);}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- ambient background (desktop showcase) ---------- */
.page-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(circle at 20% 20%, #1a1030 0%, transparent 45%),
  radial-gradient(circle at 80% 80%, #05261f 0%, transparent 45%), var(--bg-2);}
:root[data-theme="light"] .page-bg{background:
  radial-gradient(circle at 20% 20%, #e9e2ff 0%, transparent 45%),
  radial-gradient(circle at 80% 80%, #d6fbee 0%, transparent 45%), var(--bg-2);}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:blobMove 16s ease-in-out infinite;}
.blob1{width:420px;height:420px;background:#8B6CFF;top:-10%;left:-10%;}
.blob2{width:380px;height:380px;background:#00E6A8;bottom:-10%;right:-8%;animation-delay:-6s;}
@keyframes blobMove{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(40px,-30px) scale(1.15);}
}

/* ---------- phone frame ---------- */
.phone-frame{
  position:relative;z-index:1;width:392px;height:840px;
  background:linear-gradient(160deg,#1c1c26,#050508);
  border-radius:52px;padding:14px;box-shadow:var(--shadow-lg), 0 0 0 2px var(--border-strong) inset;
}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#050508;border-radius:16px;z-index:5;}
.phone-screen{width:100%;height:100%;background:var(--bg);border-radius:38px;overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--border) inset;}

#app{height:100%;display:flex;flex-direction:column;position:relative;}
.view-content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 110px;position:relative;}
.app--immersive .topbar,.app--immersive .bottomnav{display:none;}
.app--immersive .view-content{padding:0;height:100%;overflow:hidden;}

@media (max-width:560px){
  body{display:block;}
  .page-bg{display:none;}
  .phone-frame{all:unset;display:block;width:100vw;height:100dvh;background:var(--bg);}
  .notch{display:none;}
  .phone-screen{border-radius:0;box-shadow:none;}
  .view-content{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;flex-shrink:0;}
.topbar__title{font-size:20px;font-weight:800;letter-spacing:-.02em;}
.topbar__right{display:flex;align-items:center;gap:10px;}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text);position:relative;flex-shrink:0;}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface-2);}
.savings-chip{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(139,108,255,.15),rgba(0,230,168,.15));border:1px solid var(--border-strong);color:var(--accent);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:100px;margin:0 18px 12px;width:fit-content;}

/* ---------- bottom nav ---------- */
.bottomnav{display:flex;justify-content:space-around;align-items:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(16px);border-top:1px solid var(--border);flex-shrink:0;}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);padding:6px 14px;border-radius:14px;transition:color .2s ease,transform .2s ease;position:relative;}
.navitem svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.navitem.active{color:var(--primary);}
.navitem.active svg{transform:scale(1.15);}
.navitem span{font-size:10.5px;font-weight:700;}
.navitem .navdot{position:absolute;top:2px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--danger);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 22px;border-radius:16px;font-weight:800;font-size:15px;width:100%;transition:transform .15s ease,filter .15s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--grad-brand);color:#0A0A12;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-outline{background:transparent;border:1.5px solid var(--border-strong);color:var(--text);}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;border-radius:12px;}

/* ---------- onboarding ---------- */
.onboard{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:48px 28px 34px;text-align:center;position:relative;overflow:hidden;}
.onboard__blob{position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(60px);opacity:.5;}
.onboard__blob.a{background:#8B6CFF;top:-60px;left:-80px;}
.onboard__blob.b{background:#00E6A8;bottom:-40px;right:-90px;}
.brandmark{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em;z-index:1;}
.brandmark .logo-badge{width:30px;height:30px;border-radius:9px;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;color:#0A0A12;}
.leak-graphic{position:relative;width:180px;height:180px;z-index:1;display:flex;align-items:center;justify-content:center;}
.wallet{width:96px;height:70px;border-radius:16px;background:linear-gradient(145deg,#2a2a3d,#15151f);box-shadow:0 18px 40px -12px rgba(0,0,0,.5), inset 0 0 0 1px var(--border-strong);position:relative;}
.wallet::before{content:"";position:absolute;left:14px;right:14px;top:-8px;height:20px;border-radius:10px 10px 0 0;background:linear-gradient(145deg,#33334a,#1c1c28);}
.wallet::after{content:"";position:absolute;right:10px;top:26px;width:20px;height:14px;border-radius:4px;background:var(--grad-brand);opacity:.9;}
.coin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--grad-brand);top:70px;left:50%;box-shadow:0 0 0 2px rgba(0,0,0,.15) inset;animation:coinFall 2.2s ease-in infinite;}
.coin:nth-child(2){left:40%;animation-delay:.5s;background:linear-gradient(135deg,#00E6A8,#00B686);}
.coin:nth-child(3){left:60%;animation-delay:1.1s;}
.coin:nth-child(4){left:47%;animation-delay:1.6s;background:linear-gradient(135deg,#00E6A8,#00B686);}
@keyframes coinFall{
  0%{transform:translate(-50%,0) rotate(0deg);opacity:0;}
  10%{opacity:1;}
  85%{opacity:1;}
  100%{transform:translate(-50%,95px) rotate(240deg);opacity:0;}
}
.onboard__copy{z-index:1;}
.onboard__copy h1{font-size:29px;line-height:1.15;margin-bottom:12px;}
.onboard__copy h1 em{font-style:normal;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;}
.onboard__copy p{font-size:15px;max-width:300px;margin:0 auto;}
.onboard__foot{width:100%;z-index:1;display:flex;flex-direction:column;gap:14px;align-items:center;}
.onboard__foot .link{font-size:13px;color:var(--text-faint);font-weight:700;}
.trust-row{display:flex;gap:16px;font-size:11px;color:var(--text-faint);font-weight:700;}
.dropzone{width:100%;max-width:280px;border:2px dashed var(--border-strong);border-radius:20px;padding:28px 18px;text-align:center;background:var(--surface);transition:border-color .2s ease, background .2s ease;z-index:1;}
.dropzone.dragover{border-color:var(--primary);background:var(--surface-2);}
.dropzone__icon{width:56px;height:56px;border-radius:16px;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;color:#0A0A12;margin:0 auto 14px;}
.dropzone h3{font-size:16px;margin-bottom:8px;}
.dropzone p{font-size:12.5px;margin-bottom:16px;}
.privacy-note{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-faint);font-weight:600;max-width:280px;text-align:left;background:var(--surface-2);padding:10px 12px;border-radius:12px;margin-top:16px;z-index:1;}
.privacy-note svg{flex-shrink:0;color:var(--accent);}
.upload-error{font-size:12.5px;color:var(--danger);font-weight:700;margin-top:12px;}
.mode-chip{font-size:10.5px;font-weight:700;color:var(--text-faint);margin-top:1px;}

/* ---------- scanning ---------- */
.scan{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:26px;}
.radar-anim{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;}
.radar-anim .ring{position:absolute;border-radius:50%;border:1.5px solid var(--primary);opacity:0;animation:pulseRing 2.4s ease-out infinite;}
.radar-anim .ring:nth-child(2){animation-delay:.8s;}
.radar-anim .ring:nth-child(3){animation-delay:1.6s;}
@keyframes pulseRing{0%{width:20px;height:20px;opacity:.9;}100%{width:150px;height:150px;opacity:0;}}
.radar-anim .core{width:64px;height:64px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;color:#0A0A12;box-shadow:0 0 40px -6px #8B6CFF;}
.scan h2{font-size:19px;}
#scanStatusText{font-size:13.5px;color:var(--text-dim);min-height:18px;}
.progress{width:100%;max-width:260px;height:8px;border-radius:100px;background:var(--surface-2);overflow:hidden;}
.progress__bar{height:100%;width:0%;background:var(--grad-brand);border-radius:100px;transition:width .25s ease;}
#scanPct{font-size:12px;font-weight:800;color:var(--text-faint);}
.reveal{display:flex;flex-direction:column;align-items:center;gap:18px;animation:fadeSlideUp .5s ease both;}
.reveal .stat-big{font-size:34px;font-weight:800;letter-spacing:-.02em;}
.reveal .stat-big span{font-size:16px;color:var(--text-faint);font-weight:700;}
.reveal-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;width:100%;max-width:290px;}
.reveal-card .leak-line{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border-strong);}
.reveal-card .leak-line b{color:var(--danger);}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.view-content > *{animation:fadeSlideUp .35s ease both;}

/* ---------- radar / deck ---------- */
.radar-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;}
.radar-head__label{font-size:12px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.radar-head__value{font-size:26px;font-weight:800;color:var(--danger);}
.radar-head__value span{font-size:13px;color:var(--text-faint);font-weight:700;}
.radar-head__count{font-size:12px;font-weight:700;color:var(--text-dim);background:var(--surface-2);padding:6px 10px;border-radius:100px;}

.deck{position:relative;height:340px;margin-bottom:22px;}
.swipe-card{
  position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:26px;
  padding:22px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  transform:translateY(calc(var(--stack-i) * 10px)) scale(calc(1 - var(--stack-i) * 0.05));
  z-index:calc(10 - var(--stack-i)); opacity:calc(1 - var(--stack-i) * 0.25);
  transition:transform .3s ease, opacity .3s ease;
}
.swipe-card[data-top="1"]{touch-action:none;cursor:grab;}
.swipe-card[data-top="1"]:active{cursor:grabbing;}
.swipe-hint{position:absolute;top:20px;left:20px;font-weight:800;font-size:13px;letter-spacing:.05em;padding:6px 12px;border-radius:8px;border:2.5px solid;opacity:0;transform:rotate(-12deg);pointer-events:none;}
.swipe-hint--keep{color:var(--accent);border-color:var(--accent);}
.swipe-hint--cancel{color:var(--danger);border-color:var(--danger);left:auto;right:20px;transform:rotate(12deg);}
.swipe-card__top{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.swipe-card__logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 8px 18px -6px var(--c1);}
.swipe-card__name{font-weight:800;font-size:16.5px;}
.swipe-card__cat{font-size:12.5px;color:var(--text-faint);font-weight:600;}
.swipe-card__price{font-size:38px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px;}
.swipe-card__price span{font-size:15px;color:var(--text-faint);font-weight:700;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 12px;border-radius:100px;width:fit-content;}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;}
.chip--alto{background:rgba(255,77,109,.12);color:#FF7A93;}
.chip--alto::before{background:var(--danger);}
.chip--medio{background:rgba(255,176,32,.12);color:#FFC15C;}
.chip--medio::before{background:var(--warning);}
.chip--bajo{background:rgba(0,230,168,.12);color:var(--accent);}
.chip--bajo::before{background:var(--accent);}
.swipe-card__footer{margin-top:auto;text-align:center;font-size:11.5px;color:var(--text-faint);font-weight:600;}

.deck-actions{display:flex;justify-content:center;gap:26px;}
.round-btn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);transition:transform .15s ease;}
.round-btn:active{transform:scale(.9);}
.round-btn--cancel{background:var(--surface);color:var(--danger);border:1.5px solid var(--border-strong);}
.round-btn--keep{background:var(--grad-brand);color:#0A0A12;}

.floating-save{position:absolute;left:50%;top:40%;transform:translate(-50%,0);font-weight:800;font-size:20px;color:var(--accent);pointer-events:none;animation:floatUp 1s ease forwards;z-index:50;}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,20px) scale(.8);}25%{opacity:1;transform:translate(-50%,0) scale(1.1);}100%{opacity:0;transform:translate(-50%,-60px) scale(1);}}

/* ---------- empty state ---------- */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:60px 20px;}
.empty-state__icon{width:74px;height:74px;border-radius:22px;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;color:#0A0A12;margin-bottom:6px;}
.empty-state h2{font-size:19px;}
.empty-state p{font-size:14px;max-width:260px;}
.empty-state .btn{width:auto;margin-top:8px;padding:14px 24px;}

/* ---------- ahorro ---------- */
.stat-hero{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px 20px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden;}
.stat-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 0%, rgba(0,230,168,.12), transparent 60%);}
.stat-hero__label{font-size:12px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;position:relative;}
.stat-hero__value{font-size:42px;font-weight:800;color:var(--accent);letter-spacing:-.03em;margin:6px 0;position:relative;}
.stat-hero__sub{font-size:13px;color:var(--text-dim);position:relative;}
.stat-row{display:flex;gap:12px;margin-bottom:18px;}
.stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;}
.stat-box .n{font-size:20px;font-weight:800;}
.stat-box .l{font-size:11.5px;color:var(--text-faint);font-weight:700;margin-top:2px;}
.section-title{font-size:14px;font-weight:800;margin:22px 0 12px;display:flex;justify-content:space-between;align-items:center;}
.section-title .muted{font-size:12px;color:var(--text-faint);font-weight:700;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:6px;}
.chart-reveal{width:100%;overflow:hidden;}
.pending-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(139,108,255,.14),rgba(0,230,168,.1));border:1px solid var(--border-strong);border-radius:16px;padding:14px;margin-bottom:16px;}
.pending-banner p{color:var(--text);font-size:13px;font-weight:700;flex:1;}

.list-item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-item__logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;}
.list-item__body{flex:1;min-width:0;}
.list-item__name{font-weight:700;font-size:14px;}
.list-item__sub{font-size:11.5px;color:var(--text-faint);font-weight:600;}
.list-item__right{text-align:right;flex-shrink:0;}
.list-item__price{font-weight:800;font-size:14px;}
.status-tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:100px;margin-top:3px;display:inline-block;}
.status-tag--progress{background:rgba(255,176,32,.14);color:var(--warning);}
.status-tag--done{background:rgba(0,230,168,.14);color:var(--accent);}
.status-tag--kept{background:var(--surface-2);color:var(--text-faint);}

/* ---------- alertas ---------- */
.alert-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;display:flex;gap:13px;}
.alert-card__icon{width:40px;height:40px;border-radius:12px;background:rgba(255,176,32,.14);color:var(--warning);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.alert-card__body{flex:1;}
.alert-card__title{font-weight:800;font-size:14px;margin-bottom:3px;}
.alert-card__desc{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;}
.alert-card__actions{display:flex;gap:8px;}

/* ---------- perfil ---------- */
.profile-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:18px;}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#0A0A12;flex-shrink:0;}
.profile-card__name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;}
.pro-badge{font-size:9.5px;font-weight:800;background:var(--grad-brand);color:#0A0A12;padding:2px 7px;border-radius:6px;letter-spacing:.03em;}
.profile-card__email{font-size:12.5px;color:var(--text-faint);}

/* ================= REAL BANK CSV PARSING & SUBSCRIPTION DETECTION ================= */
function parseAmount(raw){
  let str=String(raw).trim().replace(/[€$\s]/g,"");
  if(!str) return null;
  let neg=false;
  if(/^\(.*\)$/.test(str)){ neg=true; str=str.slice(1,-1); }
  if(str.startsWith("-")){ neg=true; str=str.slice(1); }
  if(str.startsWith("+")) str=str.slice(1);
  const lastComma=str.lastIndexOf(","), lastDot=str.lastIndexOf(".");
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot) str=str.replace(/\./g,"").replace(",",".");
    else str=str.replace(/,/g,"");
  } else if(lastComma>-1){
    str=str.replace(/\./g,"").replace(",",".");
  }
  const n=parseFloat(str);
  if(isNaN(n)) return null;
  return neg?-Math.abs(n):n;
}
function parseDate(raw){
  const str=String(raw).trim();
  let m=str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let [,d,mo,y]=m; if(y.length===2) y="20"+y; return new Date(+y,+mo-1,+d); }
  return null;
}
function detectDelimiter(line){
  const semis=(line.match(/;/g)||[]).length, commas=(line.match(/,/g)||[]).length, tabs=(line.match(/\t/g)||[]).length;
  if(tabs>semis && tabs>commas) return "\t";
  return semis>=commas ? ";" : ",";
}
function parseCSV(text){
  const lines=text.split(/\r\n|\n|\r/).filter(l=>l.trim().length>0);
  if(lines.length===0) return {headers:[],rows:[]};
  const delim=detectDelimiter(lines[0]);
  function parseLine(line){
    const cells=[]; let cur="", inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){ if(inQuotes && line[i+1]==='"'){ cur+='"'; i++; } else inQuotes=!inQuotes; }
      else if(ch===delim && !inQuotes){ cells.push(cur); cur=""; }
      else cur+=ch;
    }
    cells.push(cur);
    return cells.map(c=>c.trim());
  }
  const headers=parseLine(lines[0]).map(h=>h.toLowerCase());
  const rows=lines.slice(1).map(parseLine);
  return {headers,rows};
}
function detectColumns(headers,rows){
  const dateKeys=["fecha","date","data"];
  const amountKeys=["importe","amount","cantidad","valor","cargo"];
  const descKeys=["concepto","descripcion","descripción","description","detalle","movimiento"];
  function findIdx(keys){ for(const k of keys){ const i=headers.findIndex(h=>h.includes(k)); if(i>-1) return i; } return -1; }
  let dateIdx=findIdx(dateKeys), amountIdx=findIdx(amountKeys), descIdx=findIdx(descKeys);
  if(dateIdx===-1 || amountIdx===-1 || descIdx===-1){
    const sample=rows.slice(0,Math.min(15,rows.length));
    const scores=headers.map(()=>({date:0,amount:0,text:0}));
    sample.forEach(r=>{
      r.forEach((val,ci)=>{
        if(!scores[ci]) return;
        if(parseDate(val)) scores[ci].date++;
        if(parseAmount(val)!==null && /\d/.test(val)) scores[ci].amount++;
        if(isNaN(parseFloat(val.replace(",","."))) && val.length>3) scores[ci].text++;
      });
    });
    if(dateIdx===-1) dateIdx=scores.reduce((best,s,i)=> s.date>scores[best].date?i:best,0);
    if(amountIdx===-1){
      let best=-1,bestScore=-1;
      scores.forEach((s,i)=>{ if(i!==dateIdx && s.amount>bestScore){bestScore=s.amount;best=i;} });
      amountIdx=best;
    }
    if(descIdx===-1){
      let best=-1,bestScore=-1;
      scores.forEach((s,i)=>{ if(i!==dateIdx && i!==amountIdx && s.text>bestScore){bestScore=s.text;best=i;} });
      descIdx=best;
    }
  }
  return {dateIdx,amountIdx,descIdx};
}
function titleCase(s){
  return s.toLowerCase().split(" ").filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
}
function normalizeMerchant(desc){
  let s=String(desc).toUpperCase();
  s=s.replace(/\d{4,}/g,"");
  s=s.replace(/[*#\/\-_.,]+/g," ");
  s=s.replace(/\s+/g," ").trim();
  const stop=new Set(["DE","LA","EL","PAGO","COMPRA","TARJETA","RECIBO","TRANSFERENCIA","ES","SL","SA","BIZUM"]);
  const words=s.split(" ").filter(w=>w.length>1 && !stop.has(w));
  return words.slice(0,3).join(" ") || s.slice(0,20) || "DESCONOCIDO";
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const toHex=x=>Math.round(255*x).toString(16).padStart(2,"0");
  return "#"+toHex(f(0))+toHex(f(8))+toHex(f(4));
}
function colorFromString(str){
  let hash=0; for(let i=0;i<str.length;i++){ hash=str.charCodeAt(i)+((hash<<5)-hash); }
  const hue=Math.abs(hash)%360;
  return {c1:hslToHex(hue,70,50), c2:hslToHex(hue,70,32)};
}
function detectSubscriptions(transactions){
  const expenses=transactions.filter(t=>t.amount<0 && t.date);
  const groups={};
  expenses.forEach(t=>{
    const key=normalizeMerchant(t.desc);
    (groups[key]=groups[key]||[]).push(t);
  });
  const results=[]; let idCounter=1000;
  Object.entries(groups).forEach(([key,txs])=>{
    if(txs.length<2) return;
    const sorted=[...txs].sort((a,b)=>a.amount-b.amount);
    const amountGroups=[];
    sorted.forEach(t=>{
      let placed=false;
      for(const g of amountGroups){
        const avg=g.reduce((a,x)=>a+x.amount,0)/g.length;
        if(Math.abs(t.amount-avg)/Math.abs(avg)<0.08){ g.push(t); placed=true; break; }
      }
      if(!placed) amountGroups.push([t]);
    });
    amountGroups.forEach(g=>{
      if(g.length<2) return;
      g.sort((a,b)=>a.date-b.date);
      const intervals=[];
      for(let i=1;i<g.length;i++) intervals.push((g[i].date-g[i-1].date)/(1000*3600*24));
      const avgInterval=intervals.reduce((a,b)=>a+b,0)/intervals.length;
      let frequency=null, divisor=1;
      if(avgInterval>=22 && avgInterval<=40){ frequency="mensual"; divisor=1; }
      else if(avgInterval>=80 && avgInterval<=100){ frequency="trimestral"; divisor=3; }
      else if(avgInterval>=330 && avgInterval<=400){ frequency="anual"; divisor=12; }
      if(!frequency) return;
      const lastDate=g[g.length-1].date;
      const monthsSince=Math.max(0,Math.round((new Date()-lastDate)/(1000*3600*24*30)));
      const avgAmount=g.reduce((a,x)=>a+Math.abs(x.amount),0)/g.length;
      const name=titleCase(key);
      idCounter++;
      results.push({
        id:idCounter, name, cat: frequency==="mensual"?"Recurrente":frequency.charAt(0).toUpperCase()+frequency.slice(1),
        price: Math.round((avgAmount/divisor)*100)/100,
        billingNote: frequency!=="mensual" ? `Cargo real: ${eur(avgAmount)} cada ${frequency==="anual"?"12":"3"} meses` : null,
        lastUsedMonths: monthsSince, initial:(name[0]||"?").toUpperCase(),
        ...colorFromString(key), decision:null, real:true,
      });
    });
  });
  return results.sort((a,b)=>b.price-a.price);
}

/* ================= CONFETTI ================= */
function triggerConfetti(){
  const canvas=document.getElementById("confettiCanvas");
  const frame=document.querySelector(".phone-frame").getBoundingClientRect();
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const ctx=canvas.getContext("2d");
  const colors=["#8B6CFF","#00E6A8","#FFB020","#FF4D6D","#5B3FFF"];
  const particles=Array.from({length:70},()=>({
    x: frame.left+frame.width/2, y: frame.top+frame.height*0.35,
    vx:(Math.random()-.5)*9, vy:(Math.random()-1.6)*9,
    size:4+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*360, vr:(Math.random()-.5)*14, life:1,
  }));
  let start=null;
  function tick(ts){
    if(!start) start=ts;
    const elapsed=ts-start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.vy+=0.22; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life=Math.max(0,1-elapsed/1800);
      ctx.save(); ctx.globalAlpha=p.life; ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx.restore();
    });
    if(elapsed<1800) requestAnimationFrame(tick); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(tick);
}

/* ================= NUMBER ANIMATION ================= */
function animateNumber(el,to,opts){
  opts=opts||{};
  const duration=opts.duration||1100, decimals=opts.decimals===undefined?2:opts.decimals;
  const suffix=opts.suffix===undefined?" €":opts.suffix, from=opts.from||0;
  const start=performance.now();
  function tick(now){
    const p=Math.min((now-start)/duration,1);
    const eased=1-Math.pow(1-p,3);
    const val=from+(to-from)*eased;
    if(el) el.textContent=val.toLocaleString("es-ES",{minimumFractionDigits:decimals,maximumFractionDigits:decimals})+suffix;
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ================= CHART ================= */
function drawChart(canvas, monthly){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth, h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  const months=6;
  const points=Array.from({length:months+1},(_,i)=>monthly*i);
  const max=Math.max(...points,1);
  const pad=10;
  const coords=points.map((v,i)=>({
    x: pad + (i/(months))*(w-pad*2),
    y: h-pad - (v/max)*(h-pad*2)
  }));
  ctx.clearRect(0,0,w,h);
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"rgba(0,230,168,.35)"); grad.addColorStop(1,"rgba(0,230,168,0)");
  ctx.beginPath(); ctx.moveTo(coords[0].x,h-pad);
  coords.forEach(c=>ctx.lineTo(c.x,c.y));
  ctx.lineTo(coords[coords.length-1].x,h-pad); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath();
  coords.forEach((c,i)=> i===0?ctx.moveTo(c.x,c.y):ctx.lineTo(c.x,c.y));
  ctx.strokeStyle="#00E6A8"; ctx.lineWidth=3; ctx.lineJoin="round"; ctx.lineCap="round"; ctx.stroke();
  coords.forEach((c,i)=>{
    ctx.beginPath(); ctx.arc(c.x,c.y,i===coords.length-1?5:3,0,Math.PI*2);
    ctx.fillStyle= i===coords.length-1 ? "#00E6A8" : "rgba(0,230,168,.6)"; ctx.fill();
  });
}

function handleFile(file){
  const errEl=document.getElementById("uploadError");
  if(errEl){ errEl.className=""; errEl.textContent=""; }
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const {headers,rows}=parseCSV(String(e.target.result));
      if(rows.length<3) throw new Error("El archivo parece vacío o no es un CSV válido.");
      const {dateIdx,amountIdx,descIdx}=detectColumns(headers,rows);
      if(dateIdx===-1||amountIdx===-1||descIdx===-1) throw new Error("No hemos podido identificar las columnas de fecha, importe y concepto.");
      const transactions=rows.map(r=>({date:parseDate(r[dateIdx]),amount:parseAmount(r[amountIdx]),desc:r[descIdx]||""}))
        .filter(t=>t.date && t.amount!==null);
      if(transactions.length<5) throw new Error("No hemos encontrado suficientes movimientos válidos en el archivo.");
      const detected=detectSubscriptions(transactions);
      if(detected.length===0){ showUploadEmptyResult(); return; }
      state.subs=detected; state.usingRealData=true; state.onboarded=true; state.scanned=true;
      persist();
      showUploadRevealResult(detected);
    }catch(err){
      if(errEl){ errEl.className="upload-error"; errEl.textContent=err.message; }
    }
  };
  reader.onerror=()=>{ if(errEl){ errEl.className="upload-error"; errEl.textContent="No se ha podido leer el archivo."; } };
  reader.readAsText(file,"UTF-8");
}
function setupUpload(){
  const input=document.getElementById("fileInput");
  const dz=document.getElementById("dropzone");
  if(input) input.addEventListener("change", e=>{ const f=e.target.files[0]; if(f) handleFile(f); });
  if(dz){
    ["dragover","dragenter"].forEach(evt=>dz.addEventListener(evt,e=>{ e.preventDefault(); dz.classList.add("dragover"); }));
    ["dragleave","drop"].forEach(evt=>dz.addEventListener(evt,e=>{ e.preventDefault(); dz.classList.remove("dragover"); }));
    dz.addEventListener("drop", e=>{ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
  }
}

/* ================= SWIPE LOGIC ================= */
function flyOutAndDecide(card,id,action){
  const dir = action==="cancel" ? -1 : 1;
  card.style.transition="transform .38s ease, opacity .38s ease";
  card.style.transform=`translate(${dir*520}px, -30px) rotate(${dir*28}deg)`;
  card.style.opacity="0";
  setTimeout(()=>decide(id,action), 340);
}
function decide(id,action){
  const sub=state.subs.find(s=>s.id===id);
  if(!sub || sub.decision) return;
  sub.decision=action;
  if(action==="cancel"){ showFloatingSaving(sub.price); }
  persist();
  const pending=state.subs.filter(s=>!s.decision).length;
  render();
  if(pending===0){
    setTimeout(()=>{ triggerConfetti(); },150);
  }
}
function setupSwipe(){
  const card=document.querySelector('.swipe-card[data-top="1"]');
  if(!card) return;
  const id=Number(card.dataset.id);
  let startX=0,startY=0,dx=0,dragging=false;
  card.addEventListener("pointerdown",e=>{
    dragging=true; startX=e.clientX; startY=e.clientY; card.style.transition="none";
    try{card.setPointerCapture(e.pointerId);}catch(err){}
  });
  card.addEventListener("pointermove",e=>{
    if(!dragging) return;
    dx=e.clientX-startX; const dy=e.clientY-startY;
    card.style.transform=`translate(${dx}px, ${dy*0.35}px) rotate(${dx/18}deg)`;
    const hint=card.querySelector(".swipe-hint");
    if(dx>28){ hint.className="swipe-hint swipe-hint--keep"; hint.textContent="MANTENER"; hint.style.opacity=Math.min(Math.abs(dx)/100,1); }
    else if(dx<-28){ hint.className="swipe-hint swipe-hint--cancel"; hint.textContent="CANCELAR"; hint.style.opacity=Math.min(Math.abs(dx)/100,1); }
    else{ hint.style.opacity=0; }
  });
  const release=()=>{
    if(!dragging) return; dragging=false;
    card.style.transition="transform .3s cubic-bezier(.2,.8,.2,1)";
    if(dx>110) flyOutAndDecide(card,id,"keep");
    else if(dx<-110) flyOutAndDecide(card,id,"cancel");
    else{ card.style.transform="translate(0,0) rotate(0)"; const hint=card.querySelector(".swipe-hint"); if(hint) hint.style.opacity=0; }
    dx=0;
  };
  card.addEventListener("pointerup",release);
  card.addEventListener("pointerleave",()=>{ if(dragging) release(); });
}

function startScanning(){
  state.view="scanning"; render();
  const phrases=["Conectando con tu banco…","Analizando 214 movimientos…","Detectando suscripciones activas…","Calculando tus fugas de dinero…"];
  let phraseIdx=0, pct=0;
  const phraseTimer=setInterval(()=>{
    phraseIdx=(phraseIdx+1)%phrases.length;
    const el=document.getElementById("scanStatusText");
    if(el) el.textContent=phrases[phraseIdx]; else clearInterval(phraseTimer);
  },600);
  const progressTimer=setInterval(()=>{
    pct=Math.min(pct+Math.random()*15+8,100);
    const bar=document.getElementById("scanBar"); const pctEl=document.getElementById("scanPct");
    if(bar) bar.style.width=pct+"%"; if(pctEl) pctEl.textContent=Math.round(pct)+"%";
    if(pct>=100){
      clearInterval(progressTimer); clearInterval(phraseTimer);
      setTimeout(()=>{
        const body=document.getElementById("scanBody");
        if(body) body.outerHTML=`<div id="scanBody">${scanRevealHTML()}</div>`;
      },300);
    }
  },240);
}

/* ================= ACTIONS ================= */
function handleAction(action,arg,el){
  switch(action){
    case "start-scan": startScanning(); break;
    case "show-upload": state.view="upload"; render(); break;
    case "nav-onboarding": state.view="onboarding"; render(); break;
    case "pick-file": { const inp=document.getElementById("fileInput"); if(inp) inp.click(); break; }
    case "enter-app":
      state.onboarded=true; state.scanned=true; persist();
      state.view = state.subs.some(s=>!s.decision) ? "radar" : "ahorro";
      render();
      break;
    case "nav": state.view=arg; render(); break;
    case "toggle-theme":
      state.theme = state.theme==="dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", state.theme);
      persist(); render();
      break;
    case "toggle-notif":
      state.notif=!state.notif; persist(); render();
      showToast(state.notif ? "Notificaciones activadas" : "Notificaciones desactivadas");
      break;
    case "decide-top":{
      const card=document.querySelector('.swipe-card[data-top="1"]');
      if(card) flyOutAndDecide(card, Number(card.dataset.id), arg);
      break;
    }
    case "dismiss-alert":
      state.dismissedAlerts.push(arg); persist(); render();
      break;
    case "alert-cta":
      showToast("Gestionado por Fuga ✓");
      state.dismissedAlerts.push(arg); persist(); render();
      break;
    case "go-pro":
      state.isPro=true; persist(); render();
      showToast("🎉 ¡Bienvenido a Fuga Pro!");
      break;
    case "reset-demo":
      if(confirm("¿Reiniciar la demo? Se borrará todo el progreso guardado.")){
        localStorage.clear(); location.reload();
      }
      break;
  }
}

/* ================= INIT ================= */
function init(){
  document.documentElement.setAttribute("data-theme", state.theme);
  document.getElementById("app").addEventListener("click",e=>{
    const t=e.target.closest("[data-action]");
    if(!t) return;
    handleAction(t.dataset.action, t.dataset.arg, t);
  });
  window.addEventListener("resize",()=>{ if(state.view==="ahorro"){ const c=document.getElementById("savingsChart"); if(c) drawChart(c, totalSaved()); }});

  if(state.onboarded && state.scanned){
    state.view = state.subs.some(s=>!s.decision) ? "radar" : "ahorro";
  } else {
    state.view="onboarding";
  }
  render();
}
init();
})();
</script>
