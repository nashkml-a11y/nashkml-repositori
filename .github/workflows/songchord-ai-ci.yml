name: SongChord AI CI

on:
  push:
    paths:
      - "songchord-ai/**"
      - ".github/workflows/songchord-ai-ci.yml"
  pull_request:
    paths:
      - "songchord-ai/**"
      - ".github/workflows/songchord-ai-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: songchord-ai/backend/requirements-dev.txt
      - name: Install backend test dependencies
        working-directory: songchord-ai/backend
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        working-directory: songchord-ai/backend
        run: pytest -q

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: songchord-ai/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: songchord-ai/frontend
        run: npm ci
      - name: Run vitest
        working-directory: songchord-ai/frontend
        run: npm run test

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: songchord-ai/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: songchord-ai/frontend
        run: npm ci
      - name: Run ESLint
        working-directory: songchord-ai/frontend
        run: npm run lint

  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: songchord-ai/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: songchord-ai/frontend
        run: npm ci
      - name: Run tsc --noEmit
        working-directory: songchord-ai/frontend
        run: npm run typecheck

  frontend-build:
    name: Frontend build (next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: songchord-ai/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: songchord-ai/frontend
        run: npm ci
      - name: Build
        working-directory: songchord-ai/frontend
        run: npm run build
