name = "mapa-web"
compatibility_date = "2026-08-01"

# Sirve la PWA como assets estáticos de un Worker (el reemplazo actual de
# Cloudflare Pages para proyectos nuevos). "dist" lo genera `npm run build`.
[assets]
directory = "dist"

# VITE_API_URL se define como variable de entorno del proyecto (Settings →
# Variables and Secrets), no aquí: Vite la incrusta en el build en tiempo de
# compilación, así que tiene que existir ANTES de `npm run build`.
